apiVersion: v1
kind: Pod
metadata:
  name: secret-file
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: redis-auth
          mountPath: /etc/redis-auth
          readOnly: true
  volumes:
    - name: redis-auth
      secret:
        secretName: redis-auth
        defaultMode: 0400
